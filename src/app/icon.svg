<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definition of shapes with colors and overlap blend modes -->
  <g style="mix-blend-mode: multiply;">
    <!-- Vertical Bar: Royal Blue (#1D4ED8) with 0.90 opacity -->
    <rect x="118" y="70" width="84" height="372" rx="42" ry="42" fill="#1D4ED8" opacity="0.9" />
    
    <!-- Top Diagonal: Deep Teal/Cyan (#0E7490) with 0.90 opacity -->
    <path d="M 160 280 L 370 110" stroke="#0E7490" stroke-width="84" stroke-linecap="round" opacity="0.9" />
    
    <!-- Bottom Diagonal: Deep Purple (#6D28D9) with 0.90 opacity -->
    <path d="M 160 232 L 370 400" stroke="#6D28D9" stroke-width="84" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
